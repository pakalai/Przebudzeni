<style>
/* Layout: jedna kolumna jak notatnik, stała dolna nawigacja kciukiem, karty tylko dla wpisów */
:root{
  --bg:#f5f5ec; --surface:#ffffff; --ink:#18291f; --muted:#5a6a5f; --line:#dfe3d6;
  --lake:#1e6a47; --lake-soft:#e2efe6; --amber:#a86f06; --amber-soft:#fbefcc; --sun:#efb02c;
  --good:#2f7a52; --good-soft:#e1f1e8; --alert:#b03a3a; --alert-soft:#f7e3e3;
  --display:ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a15; --surface:#18241d; --ink:#e8efe9; --muted:#9db0a3; --line:#2a3a30;
  --lake:#6cc495; --lake-soft:#1b3427; --amber:#f0bd4f; --amber-soft:#3a2f14; --sun:#f0bd4f;
  --good:#6fc394; --good-soft:#18342a; --alert:#e88181; --alert-soft:#3d1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a15; --surface:#18241d; --ink:#e8efe9; --muted:#9db0a3; --line:#2a3a30;
  --lake:#6cc495; --lake-soft:#1b3427; --amber:#f0bd4f; --amber-soft:#3a2f14; --sun:#f0bd4f;
  --good:#6fc394; --good-soft:#18342a; --alert:#e88181; --alert-soft:#3d1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--lake);border-color:var(--lake);color:var(--bg)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--alert)}
button.danger.armed{background:var(--alert);border-color:var(--alert);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-within{outline:2px solid var(--lake);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px}

.chip{position:relative}

.scale output{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.5ch;text-align:right;font-size:1.1rem}
details.new{background:var(--surface);border:1px solid var(--line);border-radius:14px}

details.new>summary::-webkit-details-marker{display:none}

details.new form{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--lake-soft);color:var(--lake)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
/* licznik */
.counter{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.days{font-family:var(--display);font-size:clamp(3.4rem,16vw,5rem);line-height:1;font-weight:800;color:var(--lake);font-variant-numeric:tabular-nums}

.list li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li span{min-width:0;overflow-wrap:anywhere}
.phone{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;white-space:nowrap}
a.phone{color:var(--lake);text-decoration:none}
.goal{display:flex;gap:12px;align-items:flex-start}
.goal input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--good)}
.goal.done .gt{text-decoration:line-through;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;font-family:var(--display)}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart i{display:block;width:100%;background:var(--amber);border-radius:4px 4px 0 0;min-height:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}

nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--lake)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.brand{display:flex;align-items:center;gap:14px}

.find a small{color:var(--muted);font-weight:500}
.find a:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;align-items:center}

.gate input{text-align:center;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}
.trial{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.credit{text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:.04em;padding-top:8px}
.quote{margin:0;background:var(--amber-soft);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.quote blockquote{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.35;text-wrap:balance}
.quote figcaption{font-size:.85rem;color:var(--muted)}

.wave-time{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--lake);font-variant-numeric:tabular-nums;line-height:1}
.breath-card{align-items:center;text-align:center}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--sun),var(--amber));transform:scale(.6);transition:transform 4s ease-in-out}
.ball.in{transform:scale(1)}.ball.hold{transform:scale(1)}.ball.out{transform:scale(.6);transition-duration:6s}
.breath-txt{font-weight:700;font-size:1.05rem;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.ball{transition:none}}
.tip{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.35;margin:0}
.tipcard{background:var(--amber-soft);border-color:transparent}
.alertcard{background:var(--lake-soft);border-color:transparent}
.subs li{align-items:center}.subdays{font-weight:700;color:var(--lake);font-variant-numeric:tabular-nums;white-space:nowrap}
.addrow input[type=date]{margin-top:4px;padding:6px 10px}
.grp-prev{width:56px;height:56px;object-fit:contain;flex:none}
.brand img{object-fit:cover}.gate img{object-fit:contain}
.filebtn{display:block;text-align:center}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--lake);text-decoration:underline;cursor:pointer;font-weight:600;font-size:inherit}
.privacy-hero{background:var(--good-soft);border-color:transparent}
.plist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:10px}
.declaration{border:2px solid var(--lake)}
.declaration .sign{font-family:var(--display);font-weight:800;font-size:1.1rem;margin-top:6px}
.filmcard video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block}
.quick .filmbtn{grid-column:1/-1;background:var(--lake-soft);border-color:transparent}
.quick .filmbtn b{color:var(--lake)}
.quick .stepsbtn{grid-column:1/-1;background:var(--surface);border:2px solid var(--lake)}
.quick .stepsbtn b{color:var(--lake)}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pstep{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px}
.pstep .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pstep .pt{display:flex;flex-direction:column;min-width:0}.pstep small{color:var(--muted);font-weight:500}
.pstep.praca .num,.pstep.sponsor .num{border-color:var(--amber);color:var(--amber)}
.pstep.done .num{background:var(--good);border-color:var(--good);color:var(--bg)}
.pstep.cur{border-color:var(--lake);box-shadow:0 0 0 1px var(--lake)}
.pdots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--lake)}.pdot.on{background:var(--lake)}
.pdots.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keypad button{height:72px;border-radius:50%;font-size:1.6rem;font-weight:700;padding:0}
.quick .calbtn{grid-column:1/-1}
.ins{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ins div{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.ins dt{font-size:.8rem;color:var(--muted)}.ins dd{margin:2px 0 0;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cwd{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase}

.cday.hard{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.cday.relapse{background:var(--alert);border-color:var(--alert);color:var(--bg)}

.cday.sel{box-shadow:0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;aspect-ratio:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.anniv{margin:0;background:var(--sun);color:#18291f;font-weight:800;border-radius:12px;padding:10px 14px;font-family:var(--display)}

.counter.sub{border-top-width:1px;padding:16px 18px;gap:8px}

.setbtn{width:100%;text-align:left;font-weight:600}
.gear{flex:none;width:44px;height:44px;border-radius:50%;padding:0;font-size:1.3rem;display:grid;place-items:center}
.addrow{flex-wrap:wrap}
.quote.evening{background:var(--lake-soft)}
.okbtn{background:var(--good-soft);border-color:transparent;color:var(--good)}
.sumcard{text-align:left;width:100%;max-width:420px}
.gate .sumcard{align-self:center}
.sumdot{width:18px;height:18px;border-radius:5px;aspect-ratio:auto}
.sumlbl{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.summsg{margin:4px 0 0;font-weight:600}
.nudge{background:var(--lake-soft);border-color:transparent}

.nudgebtns button{padding:10px 6px;font-weight:700}
.nudgebtns .ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.nudgebtns .warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.nudgebtns .sos{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.big{width:28px;height:28px}
.checkin h2{font-size:1.15rem}

  ['drop','Odstawienie: kiedy do lekarza','Nagłe odstawienie alkoholu po długim piciu, a także leków uspokajających, może być niebezpieczne. Drżenie, poty, kołatanie serca, omamy albo drgawki wymagają pilnej pomocy: dzwoń 112. Leków nie odstawiaj sam, rób to z lekarzem.','u'],
  ['mind','Depresja to choroba, nie słabość','Depresja to nie lenistwo ani zły charakter. To choroba, która zmienia sen, apetyt, energię, myślenie i to, jak widzisz siebie. Dobrze się leczy: psychoterapią, lekami albo jednym i drugim. Do psychiatry na NFZ nie potrzebujesz skierowania. Poprawa przychodzi stopniowo. Często najpierw wraca sen i energia, a dopiero potem nastrój.','d'],
  ['stairs','Najpierw działanie, potem ochota','W depresji czekanie, aż przyjdzie ochota, zwykle nie działa. Działa odwrotnie: mała czynność, nawet bez ochoty, po jakimś czasie poprawia nastrój. To metoda z terapii poznawczo-behawioralnej, nazywana aktywacją. Planuj małe, konkretne kroki i zapisuj, jak się czujesz po nich. W zakładce Nastrój zobaczysz, co pomaga Ci najbardziej.','d'],
  ['pill','Leki: co warto wiedzieć','Leki przeciwdepresyjne zwykle zaczynają działać po 2–4 tygodniach, a pełny efekt bywa później. Nie odstawiaj ich nagle i nie zmieniaj dawki sam/a, nawet gdy czujesz się lepiej. Skutki uboczne zgłoś lekarzowi, często da się je zmniejszyć. Aplikacja tylko przypomina, o leczeniu decyduje lekarz.','d'],
  ['drop','Alkohol a depresja','Alkohol na chwilę uspokaja, ale następnego dnia pogłębia lęk i smutek, psuje sen i osłabia działanie leków. Wiele osób po kilku tygodniach trzeźwości zauważa wyraźną poprawę nastroju. Jeśli pijesz albo bierzesz, żeby poradzić sobie z nastrojem, powiedz o tym lekarzowi.','d'],
  ['mind','Pułapki myślenia','Depresja i nałóg podsuwają myśli, które brzmią jak fakty: „zawsze wszystko psuję”, „nikt mnie nie lubi”, „to bez sensu”. To pułapki: czarnowidztwo, wszystko albo nic, czytanie w myślach, etykietki. Złap taką myśl, zapisz ją i sprawdź jak detektyw: co przemawia za, a co przeciw? W Dzienniku służy do tego zakładka Myśli.','w'],
  ['bolt','Wyzwalacze zewnętrzne i wewnętrzne','Zewnętrzne to miejsca, ludzie, sytuacje, dni tygodnia, nawet muzyka, które kojarzą się z braniem. Wewnętrzne to emocje i myśli, przy których dawniej sięgało się po substancję: złość, smutek, samotność, ale też euforia. Wypisz swoje w zakładce SOS i do każdego dopisz plan. Część wyzwalaczy da się usunąć, na resztę trzeba mieć sposób.','u'],

  ['leaf','Dobry i zły stres','Stres nie zawsze szkodzi. Dobry stres mobilizuje do działania i mija. Zły stres trwa długo i odcina od ludzi i od siebie. Chronią przed nim cztery rzeczy: ciało (ruch, sen), działanie, kontakt z ludźmi i wyobraźnia (plany, marzenia, twórczość). Pomaga też znajomość własnych wartości: wiesz wtedy, o co warto się martwić, a co odpuścić.','w'],

const SYNC_URL='https://azyl-sync.krystian-prucnel.workers.dev';
const LOCAL_KEYS=['moved','sync','installSeen','browserOk','ciOpen','lastMorning','lastEvening','moveAsked','sugState','goalSnooze','phqSnooze','push','pushAsked','featNo'];
const COLL=['feelings','cravings','goals','notes','addictions','myQuotes','acts','thoughts','phq','meds','medLog','sleep','trig'];
const PLAN_ID=['contacts'],PLAN_STR=['warning','strategies','reasons','places','safe','docQs'];
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const te=new TextEncoder(),td=new TextDecoder();
function newSyncCode(){const a=crypto.getRandomValues(new Uint8Array(16));let r='';for(const b of a)r+=B32[b%32];return 'AZYL-'+r.match(/.{4}/g).join('-')}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^AZYL/,'').replace(/O/g,'0').replace(/I/g,'1');
const fmtCode=c=>{const n=normCode(c);return n.length===16?'AZYL-'+n.match(/.{4}/g).join('-'):''};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=u=>{let r='';for(let i=0;i<u.length;i+=0x8000)r+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(r)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
let syncKC=null;
async function syncKeys(code){const c=normCode(code);if(syncKC&&syncKC.c===c)return syncKC;
 const id=hex(await crypto.subtle.digest('SHA-256',te.encode('azyl-id:'+c)));
 const raw=await crypto.subtle.importKey('raw',te.encode(c),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('azyl-sync-v1'),iterations:150000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 return syncKC={c,id,key}}
async function encS(k,o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k.key,te.encode(JSON.stringify(o))));const u=new Uint8Array(12+ct.length);u.set(iv);u.set(ct,12);return 'v1.'+b64(u)}
async function decS(k,t){const u=unb64(t.replace(/^v1\./,''));return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k.key,u.slice(12))))}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function shared(o){const r={};for(const k in o)if(!LOCAL_KEYS.includes(k))r[k]=o[k];return JSON.parse(JSON.stringify(r))}
function stripEx(o){
 COLL.forEach(k=>{if(Array.isArray(o[k]))o[k]=o[k].filter(x=>!x.ex)});
 if(o.plan){o.plan.contacts=(o.plan.contacts||[]).filter(c=>!/przykład/.test(c.name));PLAN_STR.forEach(k=>{o.plan[k]=(o.plan[k]||[]).filter(x=>!SAMPLE_PLAN.includes(x))})}
 o.examples=false;return o}
function mergeList(L,B,R,key){
 L=L||[];B=B||[];R=R||[];
 const kl=new Map(L.map(x=>[key(x),x])),kr=new Map(R.map(x=>[key(x),x])),kb=new Map(B.map(x=>[key(x),x]));
 const first=same(L.map(key),B.map(key))?R:L;const out=[],seen=new Set();
 for(const id of [...first.map(key),...L.map(key),...R.map(key)]){
  if(seen.has(id))continue;seen.add(id);
  const l=kl.get(id),r=kr.get(id),b=kb.get(id);
  if(l&&r){out.push(same(l,b)?r:l);continue}
  const x=l||r;if(b&&same(x,b))continue;out.push(x)}
 return out}
function mergeState(L,B,R){
 const M={};
 for(const k of new Set([...Object.keys(L),...Object.keys(R)])){
  if(COLL.includes(k)){M[k]=mergeList(L[k],B[k],R[k],x=>x.id);continue}
  if(k==='plan'){const lp=L.plan||{},bp=B.plan||{},rp=R.plan||{};M.plan={};
   for(const pk of new Set([...Object.keys(lp),...Object.keys(rp)]))
    M.plan[pk]=PLAN_ID.includes(pk)?mergeList(lp[pk],bp[pk],rp[pk],x=>x.id):PLAN_STR.includes(pk)?mergeList(lp[pk],bp[pk],rp[pk],x=>x):(same(lp[pk],bp[pk])&&pk in rp?rp[pk]:pk in lp?lp[pk]:rp[pk]);
   continue}
  const v=(k in L)?((same(L[k],B[k])&&(k in R||k in B))?R[k]:L[k]):((k in B)?undefined:R[k]);
  if(v!==undefined)M[k]=v}
 return M}
let syncBusy=false,syncAgain=false,syncTimer=null,syncIv=null;
function syncSoon(){if(!SYNC_URL||!S.sync||!S.sync.code)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2000)}
async function syncNow(){
 if(!SYNC_URL||!S.sync||!S.sync.code)return;
 if(syncBusy){syncAgain=true;return}
 syncBusy=true;let changed=false,msg='';
 try{
  const k=await syncKeys(S.sync.code),url=SYNC_URL.replace(/\/$/,'')+'/s/'+k.id;
  for(let attempt=0;attempt<4;attempt++){
   const g=await fetch(url,{cache:'no-store'});let R=null,n=0;
   if(g.status===200){n=+(g.headers.get('ETag')||'0').replace(/\D/g,'')||0;R=await decS(k,await g.text())}
   else if(g.status===404){if(S.sync.join){S.sync=null;saveLocal();msg='Nie znalazłem wpisów dla tego kodu. Sprawdź, czy kod jest dobry.';break}}
   else throw new Error('HTTP '+g.status);
   let B=null;try{B=JSON.parse(localStorage.getItem(KEY+'-base'))}catch(e){}
   let L=shared(S),M;
   if(!R)M=L;
   else if(!B){
    const realL=COLL.some(c=>(L[c]||[]).some(x=>!x.ex))||(L.plan&&(L.plan.contacts||[]).some(c=>!/przykład/.test(c.name)));
    if(!realL)M=R;
    else{L=stripEx(L);const names=new Set((R.addictions||[]).map(a=>(a.name||'').toLowerCase()));
     L.addictions=(L.addictions||[]).filter(a=>!names.has((a.name||'').toLowerCase()));
     const B0=JSON.parse(JSON.stringify(L));COLL.forEach(c=>delete B0[c]);delete B0.plan;M=mergeState(L,B0,R)}}
   else M=mergeState(L,B,R);
   if(!R||!same(M,R)){
    const p=await fetch(url,{method:'PUT',headers:{'If-Match':String(n),'Content-Type':'text/plain'},body:await encS(k,M)});
    if(p.status===409)continue;if(!p.ok)throw new Error('HTTP '+p.status)}
   changed=!same(M,shared(S));
   const loc={};LOCAL_KEYS.forEach(x=>{if(x in S)loc[x]=S[x]});
   try{localStorage.setItem(KEY+'-base',JSON.stringify(M))}catch(e){}
   const was=S.sync&&S.sync.join;
   S=Object.assign(JSON.parse(JSON.stringify(M)),loc);normalize();
   if(S.unlocked){unlocked=true;try{localStorage.setItem(KEY+'-ok','1')}catch(e){}}
   S.sync.at=new Date().toISOString();S.sync.err='';delete S.sync.join;saveLocal();
   if(was)msg=S.moved?'Gotowe. Twoje wpisy są pod nowym adresem.':'Połączono. Twoje wpisy są już tutaj.';
   break}
 }catch(e){if(S.sync){S.sync.err=String(e&&e.message||e);saveLocal()}}
 syncBusy=false;
 const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if((changed||tab==='ustawienia')&&!typing)try{render()}catch(e){}
 if(msg)toast(msg);
 if(syncAgain){syncAgain=false;syncNow()}
}

/* ---------- kalendarz lepszych i gorszych dni ---------- */
const DAY_CLS={good:['Dobry dzień','good'],neutral:['Tylko notatka',''],mid:['Trudniej','mid'],hard:['Ciężki dzień','hard'],relapse:['Nawrót','relapse']};
const SEV={good:0,neutral:0,mid:1,hard:2,relapse:3};
const WD=['poniedziałek','wtorek','środa','czwartek','piątek','sobota','niedziela'];
const WDS=['pn','wt','śr','cz','pt','sb','nd'];
const MON=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
let calY=null,calM=null,calDay=null,calMode='m';
function dayMap(){
 const m={},g=k=>m[k]||(m[k]={f:[],c:[],n:[]});
 S.feelings.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).f.push(x));
 S.cravings.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).c.push(x));
 S.notes.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).n.push(x));
 for(const k in m){const d=m[k];
  const heavy=Math.max(0,...d.f.filter(f=>f.emotions.some(e=>HEAVY.includes(e))).map(f=>f.level));
  const crave=Math.max(0,...d.c.map(c=>c.level));
  d.cls=d.c.some(c=>c.used)?'relapse':(crave>=7||heavy>=7)?'hard':(crave>=4||heavy>=4)?'mid':(d.f.length||d.c.length)?'good':'neutral';
 }
 return m;
}
function insights(m){
 const out=[],from=iso(new Date(today().getTime()-90*864e5));
 const days=Object.keys(m).filter(k=>k>=from);
 // dzień tygodnia
 const wd=Array.from({length:7},()=>({n:0,s:0}));
 days.forEach(k=>{const w=(new Date(k+'T12:00').getDay()+6)%7;wd[w].n++;wd[w].s+=SEV[m[k].cls]});
 const cand=wd.map((x,i)=>({i,avg:x.n?x.s/x.n:0,n:x.n})).filter(x=>x.n>=2).sort((a,b)=>b.avg-a.avg);
 if(days.length>=10&&cand.length&&cand[0].avg>0.5)out.push(['Najtrudniejszy dzień tygodnia',WD[cand[0].i]]);
 // pora dnia głodu
 const pora=[['rano (5–11)',0],['po południu (12–17)',0],['wieczorem (18–22)',0],['w nocy (23–4)',0]];
 S.cravings.filter(c=>!c.ex&&iso(new Date(c.at))>=from).forEach(c=>{const h=new Date(c.at).getHours();pora[h>=5&&h<12?0:h<18&&h>=12?1:h<23&&h>=18?2:3][1]++});
 const pz=pora.slice().sort((a,b)=>b[1]-a[1]);if(pz[0][1]>=3)out.push(['Głód pojawia się najczęściej',pz[0][0]]);
 // wyzwalacz
 const tr={};S.cravings.filter(c=>!c.ex&&iso(new Date(c.at))>=from).forEach(c=>c.triggers.forEach(t=>tr[t]=(tr[t]||0)+1));
 const tz=Object.entries(tr).sort((a,b)=>b[1]-a[1]);if(tz.length&&tz[0][1]>=3)out.push(['Najczęstszy wyzwalacz',tz[0][0]]);
 // seria bez ciężkiego dnia
 const bad=Object.keys(m).filter(k=>m[k].cls==='hard'||m[k].cls==='relapse').sort().pop();
 if(Object.keys(m).length){const since=bad?Math.round((today()-new Date(bad+'T00:00'))/864e5):null;
  out.push(['Dni od ostatniego ciężkiego dnia',since===null?'jeszcze nie było ciężkiego dnia':since===0?'dziś było ciężko, jutro nowy dzień':String(since)])}
 return out;
}
function monthGrid(y,mo,m,mini){
 const first=(new Date(y,mo,1).getDay()+6)%7,len=new Date(y,mo+1,0).getDate(),tk=iso(today());
 let h='';for(let i=0;i<first;i++)h+='<span class="cday blank"></span>';
 for(let d=1;d<=len;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const c=m[k]?m[k].cls:'';
  const fut=k>tk;
  h+=mini?`<span class="cday ${c}${k===tk?' today':''}"></span>`
   :`<button class="cday ${c}${k===tk?' today':''}${k===calDay?' sel':''}" data-cday="${k}"${fut?' disabled':''} aria-label="${d} ${MON[mo]}${c?': '+DAY_CLS[c][0]:''}">${d}</button>`}
 return h;
}
function dayDetails(k,m){
 const d=m[k],dt=new Date(k+'T12:00');
 const title=dt.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
 if(!d)return `<section class="card"><h2>${title}</h2><p class="muted">Brak wpisów tego dnia.</p></section>`;

 const rows=[...d.f.map(f=>({at:f.at,h:`<span class="pill">uczucie ${f.level}/10</span> ${esc(f.emotions.join(', '))}${f.situation?' · '+esc(f.situation):''}`})),
  ...d.c.map(c=>({at:c.at,h:`<span class="pill ${c.used?'alert':'amber'}">${c.used?'nawrót':'głód '+c.level+'/10'}</span> ${esc((c.triggers||[]).join(', '))}${c.did?' · pomogło: '+esc(c.did):''}`})),
  ...d.n.map(n=>({at:n.at,h:`<span class="pill good">${n.kind}</span> ${esc(n.kind==='bilans'?(n.good||n.hard||n.grateful||''):n.text||'')}`}))].sort((a,b)=>a.at.localeCompare(b.at));
 return `<section class="card"><div class="row between"><h2>${title}</h2><span class="pill ${DAY_CLS[d.cls][1]==='good'?'good':DAY_CLS[d.cls][1]==='mid'?'amber':DAY_CLS[d.cls][1]?'alert':''}">${DAY_CLS[d.cls][0]}</span></div>
  <ul class="list">${rows.map(r=>`<li><span><span class="small muted">${t(r)}</span> ${r.h}</span></li>`).join('')}</ul></section>`;
}
function vKalendarz(){

  <p class="small muted">To podpowiedzi do rozmowy z terapeutą lub sponsorem. Im więcej wpisów, tym są trafniejsze.</p></section>`:'';
 const tabs=`<div class="seg"><button class="${calMode==='m'?'on':''}" data-calmode="m">Miesiąc</button><button class="${calMode==='y'?'on':''}" data-calmode="y">Rok</button></div>`;
 if(calMode==='y'){
  return `<header class="top"><button class="ghost back" data-tab="postepy" aria-label="Wróć">‹</button><h1 style="flex:1">Kalendarz</h1>${tabs}</header>
  <div class="row between"><button class="ghost" data-calyear="-1">‹ ${calY-1}</button><h2>${calY}</h2><button class="ghost" data-calyear="1"${calY>=today().getFullYear()?' disabled':''}>${calY+1} ›</button></div>
  <div class="yeargrid">${MON.map((n,i)=>{const ks=Object.keys(m).filter(k=>k.startsWith(calY+'-'+String(i+1).padStart(2,'0')));const cnt={};ks.forEach(k=>cnt[m[k].cls]=(cnt[m[k].cls]||0)+1);
   return `<button class="minim" data-calmonth="${i}"><b>${n}</b><span class="cal mini">${monthGrid(calY,i,m,true)}</span><small>${ks.length?`${cnt.good||0} dobrych · ${(cnt.hard||0)+(cnt.relapse||0)} ciężkich`:'brak wpisów'}</small></button>`}).join('')}</div>
  ${legend}${insHtml}`;
 }
 const pre=calY+'-'+String(calM+1).padStart(2,'0');const ks=Object.keys(m).filter(k=>k.startsWith(pre));const cnt={};ks.forEach(k=>cnt[m[k].cls]=(cnt[m[k].cls]||0)+1);
 const isNow=calY===today().getFullYear()&&calM===today().getMonth();

/* ---------- licznik: karta dla każdego uzależnienia ---------- */
function ringSvg(a,d){
 const Y=soberYMD(a.start).y;let frac;
 if(Y<1){const nx=STONES.find(x=>x>d)||365,pv=[0,...STONES].filter(x=>x<=d).pop();frac=(d-pv)/(nx-pv)}
 else{const last=addYears(a.start,Y),nx=addYears(a.start,Y+1);frac=(today()-last)/(nx-last)}
 frac=Math.max(0.02,Math.min(1,frac));const R=52,C=2*Math.PI*R;
 return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Postęp do następnego celu: ${Math.round(frac*100)}%"><circle cx="60" cy="60" r="${R}" class="rbg"/><circle cx="60" cy="60" r="${R}" class="rfg" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="58" class="rt1">${d}</text><text x="60" y="78" class="rt2">${d===1?'dzień':'dni'}</text></svg>`;
}

 if(/marihuan|zioł|zielsk|thc|haszysz|konopi/.test(n))return 'marihuan';

 const P=phqSorted().filter(inW),SL=S.sleep.filter(x=>x.day>=fk),C=S.cravings.filter(c=>!c.ex&&inW(c));
 const out=[`Podsumowanie dla lekarza${S.name?' – '+S.name:''} (${from.toLocaleDateString('pl-PL')} – ${today().toLocaleDateString('pl-PL')})`,''];
 out.push(`Nastrój (samoocena 1–5): ${v.length?`średnio ${avgOf(v.map(x=>x.v)).toFixed(1).replace(".",",")}, zapisany w ${v.length} z ${D} dni`:'brak wpisów'}`);

 const p9=P.filter(x=>x.ans[8]>0);if(p9.length)out.push(`Uwaga: myśli o śmierci lub samookaleczeniu (PHQ-9, pyt. 9) zaznaczone ${p9.length}×, ostatnio ${new Date(p9[p9.length-1].at).toLocaleDateString('pl-PL')}`);
 if(SL.length)out.push(`Sen: średnio ${avgOf(SL.map(x=>x.hours)).toFixed(1).replace(".",",")} h${SL.some(x=>x.q)?`, jakość ${avgOf(SL.filter(x=>x.q).map(x=>x.q)).toFixed(1).replace(".",",")}/5`:''} (${SL.length} ${SL.length===1?'noc':SL.length<5?'noce':'nocy'})`);
 S.meds.forEach(m=>{const [t,n]=medAdh(m,D);out.push(`Lek: ${m.name}${m.time?' ('+m.time+')':''} – przyjęty ${t} z ${n} ${n===1?'dnia':'dni'}`)});

 catch(e){let h=0;for(const ch of 'przebudzeni:'+p)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h}
}

 if(d.actmove){const y=iso(daysAgo(1));S.acts.filter(a=>a.day===y&&!a.done).forEach(a=>{if(!S.acts.some(b=>b.day===tkey()&&b.text===a.text))S.acts.push({id:uid(),day:tkey(),text:a.text,done:false})});save();return render()}
 if(d.medtake||d.medskip){const id=d.medtake||d.medskip;S.medLog=S.medLog.filter(x=>!(x.med===id&&x.day===tkey()));S.medLog.push({id:uid(),med:id,day:tkey(),at:new Date().toISOString(),...(d.medskip?{skip:true}:{})});save();render();return toast(d.medskip?'Zapisano. Jeśli często pomijasz, powiedz lekarzowi.':'Zapisano')}
 if(d.meduntake){S.medLog=S.medLog.filter(x=>!(x.med===d.meduntake&&x.day===tkey()));save();return render()}

 if(d.copyplan)return copy(planText());
 if(d.terms){backTab=['prywatnosc','film','regulamin','uwaga'].includes(tab)?backTab:tab;return go('regulamin')}
 if(d.feedback){backTab=['prywatnosc','film','regulamin','uwaga'].includes(tab)?backTab:tab;return go('uwaga')}
 if(d.mood){const n=+d.mood;const e={id:uid(),at:new Date().toISOString(),mood:n,emotions:MOOD_EMO[n].slice(),level:MOOD_LVL[n],situation:'',thoughts:'',body:'',did:'',need:'',checkin:true,tags:[]};
  S.feelings.push(e);S.ciOpen=e.id;save();
  if(n===1){toast('Zapisano. Jestem z Tobą.');return openHelp('feel',['smutek'],9)}
  S.sugState={for:e.id,skip:[]};
  render();return toast(n>=4?'Zapisano. Dobrze to słyszeć!':'Zapisano. Mam dla Ciebie propozycję.')}
 if(d.ciclose){S.ciOpen=null;save();return render()}

  if(!S.sugState||S.sugState.for!==ci.id)S.sugState={for:ci.id,skip:[]};
  if(d.sugclose){S.sugState.closed=true;saveLocal();return render()}
  if(d.sugnext){S.sugState.skip.push(d.sugnext);if(S.sugState.skip.length>=SUGG.length)S.sugState.skip=[];saveLocal();return render()}
  const x=SUGG.find(y=>y[0]===d.sugdo);S.sugLog=(S.sugLog||[]).concat({id:x[0],cat:x[1],at:new Date().toISOString()}).slice(-60);S.sugState.done=true;save();
  if(x[4]==='breath')return openHelp('feel',['napięcie'],5);if(x[4]==='feel')return go('uczucia',true);if(x[4]==='kroki')return go('malekroki');if(x[4]==='mysl')return go('mysli',true);if(x[4]==='sos')return go('plan');
  render();return toast('Dobry wybór.')}
 if(d.goaldone){const g=S.goals.find(x=>x.id===d.goaldone);if(g){g.done=true;save();render();return toast('Brawo! Cel zrobiony.')}return}
 if(d.goalsnooze){S.goalSnooze=iso(today());saveLocal();render();return toast('Przypomnę jutro.')}
 if(d.lvlset){const box=b.closest('.lvlpick');const val=+d.v;box.querySelector('input').value=val;box.querySelectorAll('.lv').forEach((x,i)=>x.classList.toggle('on',i<val));return}
 if(d.good){
  if(!goodToday())S.feelings.push({id:uid(),at:new Date().toISOString(),emotions:['spokój'],level:2,situation:'Szybki wpis: dziś jest dobrze',thoughts:'',body:'',did:'',need:'',quick:true});
  save();render();return toast(GOOD_MSG[Math.floor(Math.random()*GOOD_MSG.length)])}
 if(d.privacy){backTab=['prywatnosc','film','regulamin','uwaga'].includes(tab)?backTab:tab;return go('prywatnosc')}
 if(d.film){backTab=['prywatnosc','film','regulamin','uwaga'].includes(tab)?backTab:tab;return go('film')}
 if(d.privback){return go(backTab||'dzis')}
 if(d.key!==undefined){return pinKey(d.key)}
 if(b.id==='pin-forgot'){
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Usuń wszystkie dane i zacznij od nowa';return}
  try{localStorage.clear()}catch(e){}S=sample();normalize();delete S.pinHash;locked=false;unlocked=false;save();render();return toast('Dane usunięte')}
 if(d.cday){calDay=d.cday;render();const el=document.querySelectorAll('section.card')[1];if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(d.calnav){calM+=+d.calnav;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}calDay=null;return render()}
 if(d.calmode){calMode=d.calmode;return render()}
 if(d.calyear){calY+=+d.calyear;return render()}
 if(d.calmonth!==undefined){calM=+d.calmonth;calMode='m';calDay=null;return render()}
 if(d.more){shown[d.more]+=30;const y=scrollY;render();scrollTo(0,y);return}
 if(d.step!==undefined){stepIdx=+d.step;return go('krok')}
 if(d.admain){const i=S.addictions.findIndex(x=>x.id===d.admain);if(i>0){const [a]=S.addictions.splice(i,1);S.addictions.unshift(a);save();render();toast('Główne: '+a.name)}return}
 if(d.grpreset){S.group={name:'',logo:''};save();render();return toast('Usunięto grupę')}
 if(d.helpnow)return openHelp('crave',[],0);
 if(d.helpfeel)return openHelp('feel',[],0);

 if(d.tipdone){help.i++;toast('Brawo. Jeszcze jedna rzecz?');return render()}
 if(d.better){toast('Dobra robota. Zapisz potem, co pomogło.');help=null;return go('dzis')}

 if(b.id==='breath-btn')return breathe(b);

 if(d.reinstall){S.installSeen=false;save();return render()}

  if(navigator.share){navigator.share({title:'Azyl',text:txt,url:SHARE_URL}).catch(()=>{})}else copy(txt+'\n'+SHARE_URL);return}
 if(d.haveapp){haveApp=true;return render()}
 if(d.browserok){haveApp=false;S.browserOk=true;save();return render()}
 if(d.installok){S.installSeen=true;save();if(isIOS()&&!inAppBrowser()){haveApp=true}return render()}
 if(d.morning){S.lastMorning=iso(today());save();return go('dzis')}
 if(d.evening){const hh=new Date().getHours();S.lastEvening=iso(hh<4?new Date(today().getTime()-864e5):today());
  if(d.evening==='good'&&!goodToday())S.feelings.push({id:uid(),at:new Date().toISOString(),emotions:['spokój'],level:2,situation:'Szybki wpis: dziś jest dobrze',thoughts:'',body:'',did:'',need:'',quick:true});
  save();if(d.evening==='bilans')return go('bilans',true);if(d.evening==='good'){go('dzis');return toast('Zapisane. Dobranoc!')}return go('dzis')}
 if(d.go){go(d.go,!!d.open);if(d.find){const el=document.getElementById('finder');el&&el.scrollIntoView()}return}
 if(b.id==='use-geo'){
  const fail=()=>toast('Lokalizacja niedostępna. Wpisz miejscowość.');
  try{navigator.geolocation.getCurrentPosition(p=>{geo=[p.coords.latitude,p.coords.longitude];render();document.getElementById('finder').scrollIntoView();toast('Mam Twoją lokalizację')},fail,{timeout:8000,maximumAge:600000})}catch(err){fail()}
  return}
 if(d.copy)return copy(d.copy);
 if(d.summary)return copy(summaryText());
 if(d.backup){const t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(()=>toast('Skopiowano. Otwórz drugą aplikację i dotknij „Wklej moje wpisy”.'),()=>copy(t))}catch(e){copy(t)}return}
 if(d.seek!==undefined){const fv=document.getElementById('film-video');if(fv){try{fv.currentTime=+d.seek;const pr=fv.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}fv.scrollIntoView({behavior:'smooth',block:'start'})}return}

 if(d.movestart){moving=true;return render()}

 if(d.moveback){moving=false;return render()}

 if(d.syncon){S.sync={code:newSyncCode()};try{localStorage.removeItem(KEY+'-base')}catch(e){}saveLocal();render();syncStart();return toast('Synchronizacja włączona')}
 if(d.syncoff){if(!confirm('Wyłączyć synchronizację na tym urządzeniu? Wpisy zostaną tutaj.'))return;S.sync=null;try{localStorage.removeItem(KEY+'-base')}catch(e){}clearInterval(syncIv);saveLocal();return render()}
 if(d.syncnow){toast('Synchronizuję…');syncNow().then(()=>{if(S.sync&&S.sync.err)toast('Brak połączenia z internetem albo serwerem.');else toast('Zsynchronizowano')});return}
 if(d.gtog){const g=S.goals.find(x=>x.id===d.gtog);g.done=b.checked;save();return setTimeout(render,150)}
 if(d.clear){['feelings','cravings','goals','notes'].forEach(k=>S[k]=S[k].filter(x=>!x.ex));S.plan.contacts=S.plan.contacts.filter(c=>!/przykład/.test(c.name));['warning','strategies','reasons'].forEach(k=>S.plan[k]=S.plan[k].filter(x=>!SAMPLE_PLAN.includes(x)));S.examples=false;save();render();return toast('Usunięto przykłady')}
 // dwustopniowe potwierdzenie usuwania
 if(d.del||d.pdel||d.cdel||d.adreset||d.addel||d.qdel||d.mdel){
  if(!b.classList.contains('armed')){b.classList.add('armed');const old=b.textContent;b.textContent='Na pewno?';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=old}},3000);return}
  if(d.del)S[d.del]=S[d.del].filter(x=>x.id!==d.id);
  if(d.pdel)S.plan[d.pdel].splice(+d.i,1);
  if(d.cdel)S.plan.contacts=S.plan.contacts.filter(c=>c.id!==d.cdel);
  if(d.adreset){const a=S.addictions.find(x=>x.id===d.adreset);if(a)a.start=iso(today());toast('Licznik liczy od dziś. Każdy dzień się liczy.')}
  if(d.addel){S.addictions=S.addictions.filter(x=>x.id!==d.addel)}
  if(d.qdel){S.myQuotes=(S.myQuotes||[]).filter(x=>x.id!==d.qdel)}
  if(d.mdel){S.meds=S.meds.filter(x=>x.id!==d.mdel)}
  save();render();return}
 if(b.id==='restore-btn'){try{restoreFrom(document.getElementById('restore-txt').value)}catch(err){toast('To nie wygląda na wpisy z tej aplikacji')}}
});
save();render();syncStart();ping();
})();
