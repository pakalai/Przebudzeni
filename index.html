<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e6a47">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Pogłębieni z Przebudzenia</title>
<style>
/* Layout: jedna kolumna jak notatnik, stała dolna nawigacja kciukiem, karty tylko dla wpisów */
:root{
  --bg:#f5f5ec; --surface:#ffffff; --ink:#18291f; --muted:#5a6a5f; --line:#dfe3d6;
  --lake:#1e6a47; --lake-soft:#e2efe6; --amber:#a86f06; --amber-soft:#fbefcc; --sun:#efb02c;
  --good:#2f7a52; --good-soft:#e1f1e8; --alert:#b03a3a; --alert-soft:#f7e3e3;
  --display:ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a15; --surface:#18241d; --ink:#e8efe9; --muted:#9db0a3; --line:#2a3a30;
  --lake:#6cc495; --lake-soft:#1b3427; --amber:#f0bd4f; --amber-soft:#3a2f14; --sun:#f0bd4f;
  --good:#6fc394; --good-soft:#18342a; --alert:#e88181; --alert-soft:#3d1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a15; --surface:#18241d; --ink:#e8efe9; --muted:#9db0a3; --line:#2a3a30;
  --lake:#6cc495; --lake-soft:#1b3427; --amber:#f0bd4f; --amber-soft:#3a2f14; --sun:#f0bd4f;
  --good:#6fc394; --good-soft:#18342a; --alert:#e88181; --alert-soft:#3d1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.6rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.banner{background:var(--lake-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--lake);border-color:var(--lake);color:var(--bg)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--alert)}
button.danger.armed{background:var(--alert);border-color:var(--alert);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-within{outline:2px solid var(--lake);outline-offset:2px}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.85rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.875rem;cursor:pointer;background:var(--surface)}
.chip input:checked+span{background:var(--lake);border-color:var(--lake);color:var(--bg)}
.chip.warm input:checked+span{background:var(--amber);border-color:var(--amber)}
.scale{display:flex;align-items:center;gap:12px}
.scale input[type=range]{padding:0;border:0;background:none;accent-color:var(--lake)}
.scale output{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.5ch;text-align:right;font-size:1.1rem}
details.new{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.new summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.new summary::-webkit-details-marker{display:none}
details.new summary::after{content:"+";font-size:1.4rem;color:var(--lake);line-height:1}
details.new[open] summary::after{content:"–"}
details.new form{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--lake-soft);color:var(--lake)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.alert{background:var(--alert-soft);color:var(--alert)}
.pill.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
/* licznik */
.counter{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.days{font-family:var(--display);font-size:clamp(3.4rem,16vw,5rem);line-height:1;font-weight:800;color:var(--lake);font-variant-numeric:tabular-nums}
.stones{display:flex;gap:6px;flex-wrap:wrap}
.stone{font-size:.75rem;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.stone.done{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:14px}
.quick button b{font-size:1rem} .quick button small{color:var(--muted);font-weight:500}
.quick .sos{background:var(--alert-soft);border-color:transparent;grid-column:1/-1}
.quick .sos b{color:var(--alert)}
.quick .warn{background:var(--amber-soft);border-color:transparent;grid-column:1/-1}
.quick .warn b{color:var(--amber)}
.quick .ok{background:var(--good-soft);border-color:transparent;grid-column:1/-1}
.quick .ok b{color:var(--good)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li span{min-width:0;overflow-wrap:anywhere}
.phone{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em;white-space:nowrap}
a.phone{color:var(--lake);text-decoration:none}
.goal{display:flex;gap:12px;align-items:flex-start}
.goal input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--good)}
.goal.done .gt{text-decoration:line-through;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;font-family:var(--display)}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart i{display:block;width:100%;background:var(--amber);border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:.7rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;border-radius:0;background:none;padding:10px 2px 12px;font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--lake)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:64px;flex:none}
.brand .g{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--lake);line-height:1.15}
.counter{border-top:5px solid var(--sun)}
.find{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.find a{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem;min-width:0}
.find a small{color:var(--muted);font-weight:500}
.find a:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;align-items:center}
.gate img{width:120px;height:120px}
.gate form,.gate .stack{width:100%;max-width:340px}
.gate input{text-align:center;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}
.trial{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.credit{text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:.04em;padding-top:8px}
.quote{margin:0;background:var(--amber-soft);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.quote blockquote{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.35;text-wrap:balance}
.quote figcaption{font-size:.85rem;color:var(--muted)}
.quote figcaption::before{content:"— "}
.quote.big{text-align:center;padding:22px 20px}
.quote.big blockquote{font-size:1.4rem}
.steps{text-align:left;margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.wave{align-items:center;text-align:center;background:var(--lake-soft);border-color:transparent}
.wave-time{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--lake);font-variant-numeric:tabular-nums;line-height:1}
.breath-card{align-items:center;text-align:center}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--sun),var(--amber));transform:scale(.6);transition:transform 4s ease-in-out}
.ball.in{transform:scale(1)}.ball.hold{transform:scale(1)}.ball.out{transform:scale(.6);transition-duration:6s}
.breath-txt{font-weight:700;font-size:1.05rem;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.ball{transition:none}}
.tip{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.35;margin:0}
.tipcard{background:var(--amber-soft);border-color:transparent}
.alertcard{background:var(--lake-soft);border-color:transparent}
.subs li{align-items:center}.subdays{font-weight:700;color:var(--lake);font-variant-numeric:tabular-nums;white-space:nowrap}
.addrow input[type=date]{margin-top:4px;padding:6px 10px}
.grp-prev{width:56px;height:56px;object-fit:contain;flex:none}
.brand img{object-fit:contain}.gate img{object-fit:contain}
.filebtn{display:block;text-align:center}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--lake);text-decoration:underline;cursor:pointer;font-weight:600;font-size:inherit}
.privacy-hero{background:var(--good-soft);border-color:transparent}
.plist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:10px}
.declaration{border:2px solid var(--lake)}
.declaration .sign{font-family:var(--display);font-weight:800;font-size:1.1rem;margin-top:6px}
.filmcard video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block}
.quick .filmbtn{grid-column:1/-1;background:var(--lake-soft);border-color:transparent}
.quick .filmbtn b{color:var(--lake)}
.quick .stepsbtn{grid-column:1/-1;background:var(--surface);border:2px solid var(--lake)}
.quick .stepsbtn b{color:var(--lake)}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pstep{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px}
.pstep .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--bg);border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pstep .pt{display:flex;flex-direction:column;min-width:0}.pstep small{color:var(--muted);font-weight:500}
.pstep.praca .num,.pstep.sponsor .num{border-color:var(--amber);color:var(--amber)}
.pstep.done .num{background:var(--good);border-color:var(--good);color:var(--bg)}
.pstep.cur{border-color:var(--lake);box-shadow:0 0 0 1px var(--lake)}
.pdots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--lake)}.pdot.on{background:var(--lake)}
.pdots.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.keypad button{height:72px;border-radius:50%;font-size:1.6rem;font-weight:700;padding:0}
.quick .calbtn{grid-column:1/-1}
.ins{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ins div{background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.ins dt{font-size:.8rem;color:var(--muted)}.ins dd{margin:2px 0 0;font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cwd{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase}
.cday{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem;font-weight:600;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cday.blank{border:0;background:none}
.cday:disabled{opacity:.35}
.cday.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cday.neutral{background:var(--lake-soft);border-color:transparent}
.cday.mid{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.cday.hard{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.cday.relapse{background:var(--alert);border-color:var(--alert);color:var(--bg)}
.cday.today{outline:2px solid var(--lake);outline-offset:1px}
.cday.sel{box-shadow:0 0 0 3px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;aspect-ratio:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;background:var(--surface)}.seg button.on{background:var(--lake);color:var(--bg)}
.yeargrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minim{display:flex;flex-direction:column;gap:5px;padding:8px;text-align:left;min-width:0}
.minim b{font-size:.8rem;text-transform:capitalize}.minim small{font-size:.66rem;color:var(--muted);font-weight:500}
.cal.mini{gap:2px}.cal.mini .cday{border-radius:2px;border-width:0;background:var(--line)}
.cal.mini .cday.blank{background:none}.cal.mini .cday.good{background:var(--good)}.cal.mini .cday.mid{background:var(--amber)}.cal.mini .cday.hard{background:var(--alert)}.cal.mini .cday.relapse{background:var(--ink)}.cal.mini .cday.neutral{background:var(--lake-soft)}
.cal.mini .cday.today{outline-width:1px;outline-offset:0}
@media (max-width:360px){.yeargrid{grid-template-columns:repeat(2,1fr)}}
.anniv{margin:0;background:var(--sun);color:#18291f;font-weight:800;border-radius:12px;padding:10px 14px;font-family:var(--display)}
.empty{color:var(--muted);font-size:.92rem;padding:12px 0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:.4;transform:translate(-50%,8px)}}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sekcje"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
/* ===== USTAWIENIA TESTU – zmień tutaj ===== */
const TEST_END='2027-10-14';      // ostatni dzień testów (RRRR-MM-DD)
const ACCESS_CODE='PRZEBUDZENI';  // kod dla grupy; pusty '' = bez kodu
const APP_VERSION='1.0';
const APP_AUTHOR='StoneMatic';

function quoteToday(){const d=today();const n=Math.floor((d-new Date(2026,0,1))/864e5);return QUOTES[((n%QUOTES.length)+QUOTES.length)%QUOTES.length]}
function greet(){const h=new Date().getHours();
 if(h>=4&&h<11)return 'Dzień dobry';if(h<18&&h>=11)return 'Cześć';if(h<23&&h>=18)return 'Dobry wieczór';return 'Dobrej nocy'}
const hello=()=>greet()+(S.name?', '+esc(S.name):'');
const quoteCard=(big)=>{const q=quoteToday();return `<figure class="quote${big?' big':''}"><div class="label">Myśl na dziś</div><blockquote>${esc(q[0])}</blockquote>${q[1]?`<figcaption>${esc(q[1])}</figcaption>`:''}</figure>`};

const STONES=[1,7,14,30,60,90,180];
const yWord=n=>n===1?'rok':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?'lata':'lat';
function addYears(st,n){const d=new Date(st+'T00:00:00');d.setFullYear(d.getFullYear()+n);return d}
function soberYMD(st){const s=new Date(st+'T00:00:00'),t=today();let y=t.getFullYear()-s.getFullYear(),m=t.getMonth()-s.getMonth(),dd=t.getDate()-s.getDate();
 if(dd<0){m--;dd+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}return {y,m,d:dd}}
function ymdText(st){const r=soberYMD(st);const p=[];if(r.y)p.push(r.y+' '+yWord(r.y));if(r.m)p.push(r.m+' mies.');if(r.d||!p.length)p.push(r.d+' '+(r.d===1?'dzień':'dni'));return p.join(', ')}
function stonesHtml(a,d){
 const Y=soberYMD(a.start).y;const chip=(lbl,done)=>`<span class="stone${done?' done':''}">${lbl}</span>`;
 if(Y<1)return STONES.map(x=>chip(x+' d.',d>=x)).join('')+chip('1 r.',false)+chip('2 r.',false);
 let h='';const from=Math.max(1,Y-3);
 if(from>1)h+=chip(from===2?'1 r.':'1–'+(from-1)+' r.',true);
 for(let y=from;y<=Y;y++)h+=chip(y+' r.',true);

function copy(text){
 const done=()=>toast('Skopiowano');
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Zaznacz tekst i skopiuj ręcznie')}ta.remove()};

}

const STEPS=[
 {t:'Bezsilność',d:'Przyznaję, że sam/a nie wygram z nałogiem i że moje życie wymknęło się spod kontroli. To nie przegrana, tylko uczciwy początek.',q:['Kiedy pierwszy raz zauważyłem/am, że nie panuję nad nałogiem?','Ile razy obiecywałem/am sobie, że przestanę lub ograniczę? Co się wtedy działo?','Co straciłem/am przez nałóg: zdrowie, relacje, pracę, pieniądze, szacunek do siebie?','Jak wyglądało moje życie w najgorszym momencie?','Co czuję, kiedy przyznaję, że sam/a sobie nie poradzę?']},

 {t:'Gotowość',d:'Staję się gotowy/a, żeby pozbyć się wad charakteru, które odkryłem/am. Nie muszę jeszcze umieć, wystarczy, że chcę.',q:['Z którą wadą najtrudniej mi się rozstać? Co mi ona „daje”?','Jak moje wady szkodzą mnie i bliskim?','Jakim człowiekiem chcę być bez nich?','Co mogę zrobić, żeby być bardziej gotowym/gotową na zmianę?']},
 {t:'Pokora',d:'Z pokorą proszę o pomoc w usunięciu swoich braków. Pokora to nie poniżanie się, tylko prawda o sobie.',q:['Czym dla mnie jest pokora?','O co dziś chcę poprosić?','Kiedy ostatnio zachowałem/am się z pokorą? Jak się z tym czułem/am?','Która wada daje o sobie znać najczęściej i jak mogę jej nie ulegać dziś?']},
 {t:'Lista krzywd',d:'Spisuję osoby, które skrzywdziłem/am, i staję się gotowy/a, żeby naprawić szkody.',q:['Kogo skrzywdziłem/am? Wypisz imiona.','Na czym polegała każda krzywda?','Czy na liście jestem także ja sam/a?','Co czuję, myśląc o naprawieniu tych szkód?','Gdzie potrzebuję rady sponsora, zanim coś zrobię?']},
 {t:'Zadośćuczynienie',d:'Tam, gdzie to możliwe, naprawiam wyrządzone szkody, chyba że zraniłoby to tę osobę lub kogoś innego.',q:['Komu mogę zadośćuczynić teraz, a z kim lepiej poczekać?','Jak konkretnie mogę naprawić szkodę: słowem, czynem, spłatą?','Gdzie naprawienie mogłoby kogoś zranić? Co wtedy zamiast tego?','Co się zmieniło we mnie po pierwszych rozmowach?']},

const STEP_ST={'':['Nie zaczęty',''],praca:['Pracuję','amber'],sponsor:['Omówione ze sponsorem',''],done:['Ukończony','good']};

 <p class="small muted">Opisy kroków i pytania są napisane własnymi słowami, jako pomoc w pracy. Oficjalny tekst Dwunastu Kroków znajdziesz w literaturze swojej wspólnoty i na stronie <a href="https://aa.org.pl/12-krokow-aa/" target="_blank" rel="noopener">aa.org.pl</a>. Najlepiej pracować z krokami razem ze sponsorem.</p>
 <p class="small muted">Wszystkie Twoje odpowiedzi zostają tylko na tym telefonie.</p>`;
}

const DAY_CLS={good:['Dobry dzień','good'],neutral:['Tylko notatka',''],mid:['Trudniej','mid'],hard:['Ciężki dzień','hard'],relapse:['Nawrót','relapse']};
const SEV={good:0,neutral:0,mid:1,hard:2,relapse:3};
const WD=['poniedziałek','wtorek','środa','czwartek','piątek','sobota','niedziela'];
const WDS=['pn','wt','śr','cz','pt','sb','nd'];
const MON=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
let calY=null,calM=null,calDay=null,calMode='m';
function dayMap(){
 const m={},g=k=>m[k]||(m[k]={f:[],c:[],n:[]});
 S.feelings.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).f.push(x));
 S.cravings.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).c.push(x));
 S.notes.filter(x=>!x.ex).forEach(x=>g(iso(new Date(x.at))).n.push(x));
 for(const k in m){const d=m[k];
  const heavy=Math.max(0,...d.f.filter(f=>f.emotions.some(e=>HEAVY.includes(e))).map(f=>f.level));
  const crave=Math.max(0,...d.c.map(c=>c.level));
  d.cls=d.c.some(c=>c.used)?'relapse':(crave>=7||heavy>=7)?'hard':(crave>=4||heavy>=4)?'mid':(d.f.length||d.c.length)?'good':'neutral';
 }
 return m;
}
function insights(m){
 const out=[],from=iso(new Date(today().getTime()-90*864e5));
 const days=Object.keys(m).filter(k=>k>=from);
 // dzień tygodnia
 const wd=Array.from({length:7},()=>({n:0,s:0}));
 days.forEach(k=>{const w=(new Date(k+'T12:00').getDay()+6)%7;wd[w].n++;wd[w].s+=SEV[m[k].cls]});
 const cand=wd.map((x,i)=>({i,avg:x.n?x.s/x.n:0,n:x.n})).filter(x=>x.n>=2).sort((a,b)=>b.avg-a.avg);
 if(days.length>=10&&cand.length&&cand[0].avg>0.5)out.push(['Najtrudniejszy dzień tygodnia',WD[cand[0].i]]);
 // pora dnia głodu
 const pora=[['rano (5–11)',0],['po południu (12–17)',0],['wieczorem (18–22)',0],['w nocy (23–4)',0]];
 S.cravings.filter(c=>!c.ex&&iso(new Date(c.at))>=from).forEach(c=>{const h=new Date(c.at).getHours();pora[h>=5&&h<12?0:h<18&&h>=12?1:h<23&&h>=18?2:3][1]++});
 const pz=pora.slice().sort((a,b)=>b[1]-a[1]);if(pz[0][1]>=3)out.push(['Głód pojawia się najczęściej',pz[0][0]]);
 // wyzwalacz
 const tr={};S.cravings.filter(c=>!c.ex&&iso(new Date(c.at))>=from).forEach(c=>c.triggers.forEach(t=>tr[t]=(tr[t]||0)+1));
 const tz=Object.entries(tr).sort((a,b)=>b[1]-a[1]);if(tz.length&&tz[0][1]>=3)out.push(['Najczęstszy wyzwalacz',tz[0][0]]);
 // seria bez ciężkiego dnia
 const bad=Object.keys(m).filter(k=>m[k].cls==='hard'||m[k].cls==='relapse').sort().pop();
 if(Object.keys(m).length){const since=bad?Math.round((today()-new Date(bad+'T00:00'))/864e5):null;
  out.push(['Dni od ostatniego ciężkiego dnia',since===null?'jeszcze nie było ciężkiego dnia':since===0?'dziś było ciężko, jutro nowy dzień':String(since)])}
 return out;
}
function monthGrid(y,mo,m,mini){
 const first=(new Date(y,mo,1).getDay()+6)%7,len=new Date(y,mo+1,0).getDate(),tk=iso(today());
 let h='';for(let i=0;i<first;i++)h+='<span class="cday blank"></span>';
 for(let d=1;d<=len;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const c=m[k]?m[k].cls:'';
  const fut=k>tk;
  h+=mini?`<span class="cday ${c}${k===tk?' today':''}"></span>`
   :`<button class="cday ${c}${k===tk?' today':''}${k===calDay?' sel':''}" data-cday="${k}"${fut?' disabled':''} aria-label="${d} ${MON[mo]}${c?': '+DAY_CLS[c][0]:''}">${d}</button>`}
 return h;
}
function dayDetails(k,m){

 const title=dt.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
 if(!d)return `<section class="card"><h2>${title}</h2><p class="muted">Brak wpisów tego dnia.</p></section>`;
 const t=x=>new Date(x.at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
 const rows=[...d.f.map(f=>({at:f.at,h:`<span class="pill">uczucie ${f.level}/10</span> ${esc(f.emotions.join(', '))}${f.situation?' · '+esc(f.situation):''}`})),
  ...d.c.map(c=>({at:c.at,h:`<span class="pill ${c.used?'alert':'amber'}">${c.used?'nawrót':'głód '+c.level+'/10'}</span> ${esc((c.triggers||[]).join(', '))}${c.did?' · pomogło: '+esc(c.did):''}`})),
  ...d.n.map(n=>({at:n.at,h:`<span class="pill good">${n.kind}</span> ${esc(n.kind==='bilans'?(n.good||n.hard||n.grateful||''):n.text||'')}`}))].sort((a,b)=>a.at.localeCompare(b.at));
 return `<section class="card"><div class="row between"><h2>${title}</h2><span class="pill ${DAY_CLS[d.cls][1]==='good'?'good':DAY_CLS[d.cls][1]==='mid'?'amber':DAY_CLS[d.cls][1]?'alert':''}">${DAY_CLS[d.cls][0]}</span></div>
  <ul class="list">${rows.map(r=>`<li><span><span class="small muted">${t(r)}</span> ${r.h}</span></li>`).join('')}</ul></section>`;
}

  <p class="small muted">To podpowiedzi do rozmowy z terapeutą lub sponsorem. Im więcej wpisów, tym są trafniejsze.</p></section>`:'';
 const tabs=`<div class="seg"><button class="${calMode==='m'?'on':''}" data-calmode="m">Miesiąc</button><button class="${calMode==='y'?'on':''}" data-calmode="y">Rok</button></div>`;
 if(calMode==='y'){
  return `<header class="top"><h1>Kalendarz</h1>${tabs}</header>
  <div class="row between"><button class="ghost" data-calyear="-1">‹ ${calY-1}</button><h2>${calY}</h2><button class="ghost" data-calyear="1"${calY>=today().getFullYear()?' disabled':''}>${calY+1} ›</button></div>
  <div class="yeargrid">${MON.map((n,i)=>{const ks=Object.keys(m).filter(k=>k.startsWith(calY+'-'+String(i+1).padStart(2,'0')));const cnt={};ks.forEach(k=>cnt[m[k].cls]=(cnt[m[k].cls]||0)+1);
   return `<button class="minim" data-calmonth="${i}"><b>${n}</b><span class="cal mini">${monthGrid(calY,i,m,true)}</span><small>${ks.length?`${cnt.good||0} dobrych · ${(cnt.hard||0)+(cnt.relapse||0)} ciężkich`:'brak wpisów'}</small></button>`}).join('')}</div>
  ${legend}${insHtml}`;
 }
 const pre=calY+'-'+String(calM+1).padStart(2,'0');const ks=Object.keys(m).filter(k=>k.startsWith(pre));const cnt={};ks.forEach(k=>cnt[m[k].cls]=(cnt[m[k].cls]||0)+1);
 const isNow=calY===today().getFullYear()&&calM===today().getMonth();
 return `<header class="top"><h1>Kalendarz</h1>${tabs}</header>
 <section class="card">

  <div class="cal">${WDS.map(x=>`<span class="cwd">${x}</span>`).join('')}${monthGrid(calY,calM,m,false)}</div>
  ${legend}
  <div class="stat">${[['good','Dobre'],['mid','Trudniej'],['hard','Ciężkie']].map(([c,l])=>`<div><span class="label">${l}</span><b>${(cnt[c]||0)+(c==='hard'?(cnt.relapse||0):0)}</b></div>`).join('')}</div>
  <p class="small muted">Dotknij dnia, żeby zobaczyć, co się wtedy działo.</p></section>
 ${calDay&&calDay.startsWith(pre)?dayDetails(calDay,m):''}
 ${insHtml}`;
}

  if(d.adreset){const a=S.addictions.find(x=>x.id===d.adreset);if(a)a.start=iso(today());toast('Licznik liczy od dziś. Każdy dzień się liczy.')}
  if(d.addel){S.addictions=S.addictions.filter(x=>x.id!==d.addel)}
  save();render();return}
 if(b.id==='restore-btn'){try{const o=JSON.parse(document.getElementById('restore-txt').value);if(!o||!Array.isArray(o.feelings))throw 0;S=o;normalize();applyMeta();save();render();toast('Przywrócono dane')}catch(err){toast('To nie wygląda na kopię zapasową z tej aplikacji')}}
});
save();render();
})();
</script>
